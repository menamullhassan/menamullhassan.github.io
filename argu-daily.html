<!DOCTYPE html>

<head>

<title>ARGU Daily | M Enam Ull Hassan</title>
<meta name="description" content="ARGU Daily: a drag-and-drop argument puzzle for English learners. Rebuild each argument card by card, then add the linking words.">
<script>
  (function () {
    var d = document.documentElement;
    try { var t = localStorage.getItem('theme'); if (t === 'dark' || t === 'light') d.setAttribute('data-theme', t); } catch (e) {}
    document.addEventListener('click', function (e) {
      var b = e.target.closest && e.target.closest('.theme-toggle');
      if (!b) return;
      var cur = d.getAttribute('data-theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      var next = cur === 'dark' ? 'light' : 'dark';
      d.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  .game-body { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  .game-body header.nav { flex: none; }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>

    <button class="theme-toggle" type="button" aria-label="Switch between light and dark mode" title="Light / dark mode">
      <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
      <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
    </button>
  </div>
</header>

<main class="game-page">
  <div class="wrap game-bar">
    <p class="eyebrow"><a class="crumb" href="resources.html">Resources</a> · Game</p>
    <h1 class="sr-only">ARGU Daily</h1>
  </div>
  <iframe class="game-frame" src="argu-daily-game.html?v=4" title="ARGU Daily: a drag-and-drop argument puzzle"></iframe>
</main>

<script>
  const btn = document.querySelector('.menu-btn'), menu = document.getElementById('menu');
  btn.addEventListener('click', () => {
    const open = menu.classList.toggle('open');
    btn.setAttribute('aria-expanded', open);
  });
  // Keep the game's light/dark mode in step with the site toggle
  const frame = document.querySelector('.game-frame');
  function syncTheme() {
    try {
      const root = frame.contentDocument && frame.contentDocument.documentElement;
      if (!root) return;
      const t = document.documentElement.getAttribute('data-theme');
      if (t) root.setAttribute('data-theme', t); else root.removeAttribute('data-theme');
    } catch (e) {}
  }
  frame.addEventListener('load', syncTheme);
  new MutationObserver(syncTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
</script>
</body>
</html>
